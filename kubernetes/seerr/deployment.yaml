apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seerr
  template:
    metadata:
      labels:
        app: seerr
    spec:
      # Seerr's image has no init process (Docker docs say --init). Sharing the
      # PID namespace makes the pod's pause container PID 1, which reaps zombies.
      shareProcessNamespace: true
      # The image runs as the `node` user; /var/lib/k8s/seerr must be 1000:1000.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
      - name: seerr
        image: ghcr.io/seerr-team/seerr:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5055
        env:
        - name: LOG_LEVEL
          value: "debug"
        - name: TZ
          value: "America/Argentina/Buenos_Aires"
        readinessProbe:
          httpGet:
            path: /api/v1/settings/public
            port: 5055
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /api/v1/settings/public
            port: 5055
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 3
        volumeMounts:
        - name: config
          mountPath: /app/config
      volumes:
      - name: config
        hostPath:
          path: /var/lib/k8s/seerr
