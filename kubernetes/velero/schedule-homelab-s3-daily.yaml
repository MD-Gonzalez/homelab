apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: homelab-s3-daily
  namespace: velero
spec:
  schedule: "0 3 * * *"
  skipImmediately: false
  useOwnerReferencesInBackup: false
  template:
    includedNamespaces: ["homelab"]
    storageLocation: aws-s3
    ttl: 720h0m0s
    csiSnapshotTimeout: 0s
    itemOperationTimeout: 0s
    hooks: {}
    metadata: {}
