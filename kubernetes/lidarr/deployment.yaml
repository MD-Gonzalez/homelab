apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  namespace: homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lidarr
  template:
    metadata:
      labels:
        app: lidarr
    spec:
      containers:
      - name: lidarr
        # was youegraillot/lidarr-on-steroids (unmaintained since 2024, Lidarr 2.5):
        # it can't log into qBittorrent 5.2+, fixed upstream in Lidarr 3.1.3
        image: lscr.io/linuxserver/lidarr:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/Argentina/Buenos_Aires"
        ports:
        - containerPort: 8686
        volumeMounts:
        - name: config
          mountPath: /config
        - name: music
          mountPath: /music
        - name: downloads
          mountPath: /downloads
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: lidarr-config-pvc
      - name: music
        hostPath:
          path: /media/music 
      - name: downloads
        hostPath:
          path: /media/downloads 
