#	$OpenBSD: pf.conf,v 1.55 2017/12/03 20:40:04 sthen Exp $
#
# See pf.conf(5) and /etc/examples/pf.conf

# --- Interfaces ---
wan = "re0"
lan = "re1"
wg  = "wg0"

# --- Martians ---
table <martians> const { \
	0.0.0.0/8, 100.64.0.0/10, \
	169.254.0.0/16, 172.16.0.0/12, \
	192.0.0.0/24, 192.0.2.0/24, \
	198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, \
	240.0.0.0/4, 255.255.255.255/32 }

table <bruteforce> persist

# --- Options ---
set block-policy drop
set loginterface $wan
set skip on lo0

# --- Normalization ---
match in all scrub (no-df random-id reassemble tcp)

# --- NAT ---
match out on $wan inet from $lan:network to any nat-to ($wan)
match out on $wan inet from 10.10.0.0/24 to any nat-to ($wan)

# --- Default deny ---
block all

# --- Antispoof ---
antispoof quick for $wan
antispoof quick for $lan

# --- Block martians ---
block drop in  quick on $wan from <martians> to any
block drop out quick on $wan from any to <martians>

# --- Block bruteforce ---
block drop in quick from <bruteforce>

# --- WireGuard ---
pass in  on $wan inet proto udp from any to any port 51820 keep state
pass in  on $wg  inet from 10.10.0.0/24 to any keep state
pass out on $wg  inet from any to 10.10.0.0/24 keep state

# --- WireGuard <-> LAN forwarding ---
pass in  on $wg  inet from 10.10.0.0/24 to $lan:network keep state
pass out on $lan inet from 10.10.0.0/24 to $lan:network keep state
pass in  on $lan inet from $lan:network to 10.10.0.0/24 keep state
pass out on $wg  inet from $lan:network to 10.10.0.0/24 keep state

# --- WAN inbound (return traffic only) ---
pass in on $wan inet proto tcp  from any to ($wan) \
	 flags S/SA modulate state \
	 (max-src-conn 100, max-src-conn-rate 15/5, overload <bruteforce> flush global) 
pass in on $wan inet proto udp  from any to ($wan) keep state
pass in on $wan inet proto icmp from any to ($wan) \
	 icmp-type { echoreq unreach timex } keep state

# --- LAN ---
pass in  on $lan inet from $lan:network to any keep state
pass out on $wan inet from $lan:network to any keep state

# --- SSH (LAN only) ---
block in quick on $wan proto tcp to port 22
pass in on $lan inet proto tcp from $lan:network to $lan port 22 \
    keep state \
    (max-src-conn 5, max-src-conn-rate 3/10, overload <bruteforce> flush global)

# --- Router ---
pass out on $wan inet from ($wan) to any keep state
pass out on $wan inet proto icmp from ($wan) to any keep state
pass out on $lan inet from ($lan) to any keep state
